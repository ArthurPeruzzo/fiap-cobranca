services:
  # DynamoDB Local: o banco NoSQL da cobranca em desenvolvimento (em memoria; a tabela e criada na partida).
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

  cobranca:
    build: .
    ports:
      - "8082:8082"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_CRIAR_TABELA: "true"
      # Broker no compose do fiap-mecanica (porta 5672 publicada no host)
      RABBITMQ_HOST: ${RABBITMQ_HOST:-host.docker.internal}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-fiap}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - dynamodb
