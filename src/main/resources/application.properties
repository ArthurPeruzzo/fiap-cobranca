spring.application.name=cobranca
server.port=8082

# Mesmo segredo e issuer da API principal (fiap-mecanica): o JWT emitido por ela e aceito aqui.
jwt.secret=${JWT_SECRET}
jwt.issuer=mecanica-fiap

# Banco NoSQL: DynamoDB (um pagamento por OS). Na AWS usa a role do pod; localmente aponte DYNAMODB_ENDPOINT para o
# DynamoDB Local e ligue a criacao da tabela.
cobranca.dynamodb.region=${AWS_REGION:us-east-1}
cobranca.dynamodb.endpoint=${DYNAMODB_ENDPOINT:}
cobranca.dynamodb.tabela=${DYNAMODB_TABELA:cobranca-pagamento}
cobranca.dynamodb.criar-tabela=${DYNAMODB_CRIAR_TABELA:false}

# Meio de pagamento: GatewayPagamentoHttp (secret -> token -> pagamento, com retry e circuit breaker). Por padrao chama
# o mock deste proprio servico (/mock-pagamentos); outro meio e so trocar url e credenciais. Se o meio estiver fora, o
# pagamento fica PENDENTE e a equipe decide em /pagamentos/{os}/aprovar|recusar.
cobranca.pagamento.mock.client-id=${PAGAMENTO_MOCK_CLIENT_ID:cobranca}
cobranca.pagamento.mock.client-secret=${PAGAMENTO_MOCK_CLIENT_SECRET:mock-secret}
cobranca.pagamento.http.url=${PAGAMENTO_URL:http://localhost:${server.port}/mock-pagamentos}
cobranca.pagamento.http.client-id=${PAGAMENTO_CLIENT_ID:${cobranca.pagamento.mock.client-id}}
cobranca.pagamento.http.client-secret=${PAGAMENTO_CLIENT_SECRET:${cobranca.pagamento.mock.client-secret}}
cobranca.pagamento.http.connect-timeout=2s
cobranca.pagamento.http.read-timeout=5s

# Resiliencia do meio de pagamento. O retry e externo ao circuit breaker: cada tentativa conta na janela do circuito.
# So falha de servidor (5xx) ou de rede repete e conta como falha; 4xx e recusa nao.
resilience4j.retry.instances.gatewayPagamento.max-attempts=3
resilience4j.retry.instances.gatewayPagamento.wait-duration=200ms
resilience4j.retry.instances.gatewayPagamento.enable-exponential-backoff=true
resilience4j.retry.instances.gatewayPagamento.exponential-backoff-multiplier=2
resilience4j.retry.instances.gatewayPagamento.retry-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException
# Com o mock, o ciclo normal tem 50% de falhas (503, 503, aprovado, recusado): abaixo do limite de 75%, o circuito so abre
# quando o meio cai de vez. Aberto, rejeita na hora (fallback => PENDENTE) por 30s e depois testa com 2 chamadas.
resilience4j.circuitbreaker.instances.gatewayPagamento.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.gatewayPagamento.sliding-window-size=8
resilience4j.circuitbreaker.instances.gatewayPagamento.minimum-number-of-calls=8
resilience4j.circuitbreaker.instances.gatewayPagamento.failure-rate-threshold=75
resilience4j.circuitbreaker.instances.gatewayPagamento.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.gatewayPagamento.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.gatewayPagamento.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.gatewayPagamento.record-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException

# Mensageria (RabbitMQ): consome o comando de pagamento do fiap-mecanica e responde no exchange ordemservico.eventos.
# Falha ao processar => retry com espera crescente; esgotadas as tentativas a mensagem vai para a DLQ.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:fiap}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# O consumo vira um span filho do trace que vem no cabecalho traceparent da mensagem.
spring.rabbitmq.listener.simple.observation-enabled=true
spring.rabbitmq.listener.simple.retry.enabled=true
# max-retries conta as tentativas DEPOIS da primeira (3 => 4 execucoes no total)
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
cobranca.mensageria.exchange=cobranca.comandos
cobranca.mensageria.fila.solicitar-pagamento=cobranca.solicitar-pagamento
cobranca.mensageria.routing-key.solicitar-pagamento=pagamento.solicitar
cobranca.mensageria.listener.enabled=true
# Respostas ao orquestrador (fiap-mecanica): a OS declara a fila ordemservico.respostas; a cobranca so publica no exchange.
ordemservico.mensageria.exchange=ordemservico.eventos
ordemservico.mensageria.routing-key.pagamento-confirmado=pagamento.confirmado
ordemservico.mensageria.routing-key.pagamento-recusado=pagamento.recusado
# Confirmacao do broker + devolucao de mensagem nao roteada: so assim a resposta e dada como entregue.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# A publicacao leva o traceparent na mensagem: a resposta continua o MESMO trace.
spring.rabbitmq.template.observation-enabled=true

swagger.server-url=${PUBLIC_BASE_URL:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# O broker fora do ar nao pode derrubar a probe: as mensagens ficam na fila e o consumo retoma quando ele voltar.
management.health.rabbit.enabled=false

# Logs estruturados (ECS) em JSON no console: o agente/coletor da New Relic os recolhe do stdout.
logging.structured.format.console=ecs

# Observabilidade (mesma do fiap-mecanica e do fiap-estoque): traces + metricas exportados via OTLP para a New Relic.
# O service.name vem de spring.application.name ("cobranca"), entao o servico aparece separado dos demais.
# A api-key vem de NEW_RELIC_LICENSE_KEY (env var / k8s Secret), nunca hardcoded. Os logs ECS acima incluem
# trace.id/span.id quando ha trace ativo, correlacionando logs e traces.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:https://otlp.nr-data.net:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.headers.api-key=${NEW_RELIC_LICENSE_KEY:}
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:https://otlp.nr-data.net:4318/v1/metrics}
management.otlp.metrics.export.headers.api-key=${NEW_RELIC_LICENSE_KEY:}
# A New Relic e um sistema delta: com o default (cumulative) os Timers viram histogramas cumulativos
# re-emitidos a cada step, e average()/count() no NRQL ficam sem sentido.
management.otlp.metrics.export.aggregation-temporality=delta
management.otlp.metrics.export.histogram-flavor=base2-exponential-bucket-histogram
# Step menor => o dado aparece no dashboard em ~30s em vez de ate 1min.
management.otlp.metrics.export.step=30s
